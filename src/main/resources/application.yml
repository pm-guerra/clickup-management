spring:
  application:
    name: clickup-management
  config:
    # Local convenience: load secrets from a git-ignored .env file if present.
    # Real environment variables (e.g. on Cloud Run) take precedence.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  jackson:
    # ClickUp's API is snake_case; lets DTO records map without annotations.
    property-naming-strategy: SNAKE_CASE
  # Local default: H2 file database (PostgreSQL mode) in ./data - nothing to install.
  # Cloud Run overrides with SPRING_DATASOURCE_URL/USERNAME/PASSWORD pointing at Cloud SQL.
  datasource:
    url: jdbc:h2:file:./data/clickup;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  admin-api-key: ${ADMIN_API_KEY}
  # Where the OAuth token and webhook secret are kept: "local" (encrypted files) or "gcp" (Secret Manager).
  secret-store:
    type: ${SECRET_STORE:local}
    local-path: ${LOCAL_SECRETS_PATH:./data/secrets}
    local-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    gcp-project-id: ${GCP_PROJECT_ID:}
  # Webhook event inbox and retries
  events:
    max-attempts: 8
    initial-backoff: 1m
    max-backoff: 6h
    lock-duration: 5m
    batch-size: 20
    # One event at a time, at most one every 3s (~2-3 ClickUp calls each, i.e. ~60 calls/min, under ClickUp's
    # 100/min limit). A run keeps going for up to 50s, then the next trigger (every minute) continues.
    pacing: 3s
    run-budget: 50s
    retention: 30d
    scheduler:
      # In-process trigger for local runs; on Cloud Run, Cloud Scheduler calls POST /admin/events/process-due.
      enabled: ${EVENT_SCHEDULER_ENABLED:true}
      interval: 60s

  # Mentions of Octo bot: task comments come via the webhook, chat channels are polled every minute (the bot must
  # be a member). Recorded with ids only; forwarding to the agent comes later.
  mentions:
    enabled: true
    bot-user-id: 106723346
    channels:
      - 2kyqtcmb-5395
      - 6-901522637869-8
    page-size: 50
    thread-lookback: 7d
    # Once a mention reached the agent: this reaction on the chat message, and this reply in a task comment's thread
    # (the API can't add reactions to comments)
    reaction: eyes
    comment-reply: "👀"
    # Each new mention is sent to the agent's routine with its text, read from ClickUp right before sending and never
    # stored. Off while the token is empty (e.g. locally).
    forward:
      url: https://api.anthropic.com/v1/claude_code/routines/trig_01LbTta7542GUe2PaCBNzY7N/fire
      token: ${AGENT_ROUTINE_TOKEN:}
      beta-header: experimental-cc-routine-2026-04-01
      max-attempts: 5
      max-age: 1d
      timeout: 30s
  # Hourly audit of tasks changed since the previous run (see AuditJob). Sends a ClickUp DM only for new issues.
  audit:
    enabled: true
    initial-lookback: 7d
    overlap: 5m
    api-pacing: 1s
    max-pages: 20
    # Empty = whole Workspace
    list-ids: []
    # Report goes to this ClickUp Chat channel; or, if empty, as a DM to notify-user-id
    notify-channel-id: ${AUDIT_NOTIFY_CHANNEL_ID:}
    notify-user-id: ${AUDIT_NOTIFY_USER_ID:}
    # The "Automation Rules" ClickUp doc, linked from reports and from undo comments
    rules-doc-url: https://app.clickup.com/90152153739/docs/2kyqtcmb-7115
    # Who's who for the permission rules (ClickUp user ids). Anyone not listed has no permissions.
    people:
      # enforce: their forbidden changes are undone right away (everyone but the admins)
      # unrestricted: the status rules (in testing / ready_for_dev placement, parents ahead of subtasks)
      # don't apply to them; everyone else's moves that break them are undone.
      # The app itself acts as Octo bot (it authorized the OAuth app); its automatic changes are always allowed
      - { id: "106723346", name: Octo bot, role: admin, unrestricted: true }
      - { id: "100796657", name: Pedro, role: admin, unrestricted: true }
      - { id: "106501885", name: José, role: admin }
      - { id: "106791322", name: Martim, role: tester, enforce: true }
      - { id: "106744781", name: Katya, role: tester, enforce: true }
      - { id: "266659509", name: Catarina, role: tester, enforce: true }
      - { id: "112510284", name: Luís, role: dev, stream: backend, enforce: true }
      - { id: "278564675", name: Vivek, role: dev, stream: mobile, enforce: true }
      - { id: "308507562", name: Sebastian, role: dev, stream: mobile, enforce: true }
      - { id: "106773419", name: Nubelson, role: dev, stream: web, enforce: true }
      - { id: "106655756", name: Danylo, role: dev, stream: web, enforce: true }
    # Testers move these; devs move the stream tasks under them
    main-task-types: [Story, Bug, Change, Feature, Defect, Epic]
    streams: [backend, web, mobile]
    scheduler:
      # Local in-process trigger; on Cloud Run, Cloud Scheduler calls POST /admin/audit/run hourly.
      enabled: ${AUDIT_SCHEDULER_ENABLED:false}
    rules:
      stream-task-status:
        enabled: true
        parent-types: [Story, Bug, Change, Feature, Defect]
        # Only Task-type subtasks are stream tasks; nested Bugs/Changes/Stories are not
        stream-types: [Task]
        # ready_for_dev is further limited to mobile (status-placement); on hold is left to people
        allowed-statuses: [pending, to do, in progress, blocked, review, ready_for_dev, in development, complete,
                           waiting info, on hold]
      # Main tasks: testers/admins move them; stream tasks: their stream's devs/admins (checked on each change)
      status-move:
        enabled: true
      # Only admins add/remove the backend/web/mobile tags
      stream-tag-change:
        enabled: true
      # Parents out of step with their subtasks are moved where their subtasks put them, and reported
      parent-status:
        enabled: true
      # Only Story/Bug/Change/Feature/Defect in in testing; only mobile in ready_for_dev
      status-placement:
        enabled: true
      # Defects: only inside a Feature, Bug or Change, and never estimated (sprint points are cleared)
      defects:
        enabled: true
        types: [Defect]
        parent-types: [Feature, Bug, Change]
        clear-points: true
      # Once work has started, only admins change a task's priority or Product Priority
      priority-lock:
        enabled: true
        statuses: [in progress, blocked, review, ready_for_dev, in development, in testing, approved]
        fields: [Product Priority]

clickup:
  client-id: ${CLICKUP_CLIENT_ID}
  client-secret: ${CLICKUP_CLIENT_SECRET}
  redirect-uri: ${CLICKUP_REDIRECT_URI:${app.base-url}/clickup/oauth/callback}
  workspace-id: ${CLICKUP_WORKSPACE_ID}
  api-base-url: https://api.clickup.com/api/v2
  authorize-url: https://app.clickup.com/api
  connect-timeout: 5s
  read-timeout: 30s
  rate-limit:
    max-retries: 3
    max-wait: 60s
  # The webhook subscribes to exactly the events the enabled workflows handle (no "*").
  workflows:
    copy-parent-fields:
      enabled: true
      # JSON object {"childFieldId": "parentFieldId"}; same id on both sides for now.
      field-mappings: ${CLICKUP_CUSTOM_FIELD_MAPPINGS:{}}
      # Optional: only copy when the parent's custom task type id matches (e.g. the "Bug" type).
      parent-custom-item-id: ${CLICKUP_BUG_CUSTOM_ITEM_ID:}
    # While a Story/Bug/Change is still in "to do", a priority change is copied to its stream tasks
    # (see PrioritySyncWorkflow).
    # A parent's priority and Product Priority are pushed down to its children and grandchildren, whatever their
    # status (see PrioritySyncWorkflow). Defects keep their own.
    priority-sync:
      enabled: true
      parent-types: [Story, Bug, Change, Feature, Defect, Task]
      skip-types: [Defect]
      fields: [Product Priority]
    # When testing rejects a task (in testing -> in progress / to do), reopen its completed subtasks
    # (see RejectionReopenWorkflow). Defects inside it have their own lifecycle and aren't reopened.
    rejection-reopen:
      enabled: true
      task-types: [Story, Bug, Change, Feature, Defect]
      from-statuses: [in testing]
      to-statuses: [in progress, to do]
      reopen-statuses: [complete]
      reopen-to: waiting info
      ignored-subtask-types: [Defect]
    # When a task is created, set field defaults by task type (see CreateDefaultsWorkflow).
    create-defaults:
      enabled: true
      rules:
        - task-types: [Bug, Change]
          field: maintenance
          value: "true"
        # A Defect inherits maintenance from the Feature/Bug/Change it's in
        - task-types: [Defect]
          field: maintenance
          from-parent: true
    # A parent's status follows its subtasks, forwards and backwards (see ParentStatusPolicy). Checked when a
    # subtask's status changes or a subtask is created; works at any depth.
    parent-status:
      enabled: true
      # Epics are left alone
      parent-types: [Story, Bug, Change, Feature, Defect, Task]
      # All subtasks complete -> in testing for these, complete for the others (a Task wrapping tasks)
      testing-types: [Story, Bug, Change, Feature, Defect]
      mobile-stream: mobile
      # Defects have their own lifecycle: they don't move the task they're in
      ignored-child-types: [Defect]
    # When a tag is added to a task, create a subtask under it (see TagSubtaskWorkflow).
    # Fields are matched by name on the parent's list; missing fields are skipped with a warning.
    tag-subtasks:
      enabled: true
      rules:
        - tag: backend
          task-types: [Story, Bug, Change, Feature, Defect]
          title-prefix: "Backend | "
          status: to do
          tags: [backend]
          set-fields:
            - field: maintenance
              value: "true"
              parent-types: [Bug, Change]
            - field: maintenance
              from-parent: true
              parent-types: [Defect]
          copy-fields:
            - Product Priority
          copy-priority: true
        - tag: web
          task-types: [Story, Bug, Change, Feature, Defect]
          title-prefix: "Web | "
          status: to do
          tags: [web]
          set-fields:
            - field: maintenance
              value: "true"
              parent-types: [Bug, Change]
            - field: maintenance
              from-parent: true
              parent-types: [Defect]
          copy-fields:
            - Product Priority
          copy-priority: true
        - tag: mobile
          task-types: [Story, Bug, Change, Feature, Defect]
          title-prefix: "Mobile | "
          status: to do
          tags: [mobile]
          set-fields:
            - field: maintenance
              value: "true"
              parent-types: [Bug, Change]
            - field: maintenance
              from-parent: true
              parent-types: [Defect]
          copy-fields:
            - Product Priority
          copy-priority: true
